<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cribbage Scorer</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <h1>Cribbage Hand Scorer</h1>
  <button id="draw-deck">Draw New Deck</button>
  <div id="cards"></div>

  <div id="hand" class="card-container"></div>
  <h3>Turn Card:</h3>
  <div id="turn-card" class="card-container"></div>
  <button id="score-btn">Score Hand</button>
  <h2 id="score"></h2>
  
  <script src="/static/js/script.js"></script>
</body>
</html>
