<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cribbage Scorer</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin-top: 20px;
      font-size: 2.5em;
      color: #444;
    }
    .container {
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    .card-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }
    button {
      padding: 10px 20px;
      margin: 10px 0;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #score {
      font-size: 2em;
      margin-top: 20px;
    }
    #score-breakdown {
      margin-top: 20px;
      padding: 10px;
      background: #e9ecef;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Cribbage Hand Scorer</h1>
  <div class="container">
    <div class="d-flex justify-content-between mb-3">
      <button id="draw-deck" class="btn btn-primary">Draw New Deck</button>
      <div id="cards" class="card-container">
        <!-- Card images will be added here -->
      </div>
    </div>
    <div class="row">
      <div class="col-9">
        <h3>Your Hand:</h3>
        <div id="hand" class="card-container"></div>
      </div>
      <div class="col-3">
        <h3>Turn Card:</h3>
        <div id="turn-card" class="card-container"></div>
      </div>
    </div>
    <button id="score-btn" class="btn btn-primary">Score Hand</button>
    <h2 id="score"></h2>
    <div id="score-breakdown">
      <!-- Score breakdown will appear here -->
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="/static/js/script.js"></script>
</body>
</html>
