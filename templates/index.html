<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cribbage Scorer</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <h1>Cribbage Hand Scorer</h1>
  <div class="container">
    <div class="d-flex justify-content-between mb-3">
      <button id="draw-deck" class="btn btn-primary">Draw New Deck</button>
      <div id="cards" class="card-container">
        <!-- Card images will be added here -->
      </div>
    </div>
    <div class="row">
      <div class="col-9">
        <h3>Your Hand:</h3>
        <div id="hand" class="card-container"></div>
      </div>
      <div class="col-3">
        <h3>Turn Card:</h3>
        <div id="turn-card" class="card-container"></div>
      </div>
    </div>
    <button id="score-btn" class="btn btn-primary">Score Hand</button>
    <h2 id="score"></h2>
    <div id="score-breakdown">
      <!-- Score breakdown will appear here -->
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="/static/js/script.js"></script>
</body>
</html>
